<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#11151b">
		<!-- Installed from the Home Screen the game runs full screen, no browser bars -->
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Scrapline">
		<link rel="manifest" href="manifest.webmanifest">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #11151b; color: #e3e8ee; font-family: system-ui, sans-serif; overscroll-behavior: none; touch-action: none; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #11151b; z-index: 5; text-align: center; padding: 24px; }
#status[hidden] { display: none; }
#bar { width: min(60vw, 320px); height: 8px; background: #232b36; border-radius: 4px; overflow: hidden; }
#bar > div { height: 100%; width: 0; background: #f2b134; transition: width 0.15s; }
#message { font-size: 17px; }
/* The game is landscape only: a phone held upright is asked to turn. */
#rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #11151b; font-size: 18px; text-align: center; padding: 24px; }
#rotate b { font-size: 40px; color: #f2b134; }
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
/* Full screen: a button where the browser has the Fullscreen API, an install hint on iPhone, nothing once installed. */
#fullscreen { position: fixed; z-index: 6; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); min-width: 44px; min-height: 44px; padding: 0 14px; border: 1px solid #3a4655; border-radius: 8px; background: rgba(17, 21, 27, 0.8); color: #e3e8ee; font: inherit; font-size: 15px; touch-action: manipulation; }
#fullscreen[hidden], #installHint[hidden] { display: none; }
#installHint { position: fixed; z-index: 6; top: calc(max(8px, env(safe-area-inset-top)) + 52px); right: max(8px, env(safe-area-inset-right)); max-width: min(70vw, 320px); padding: 10px 14px; border-radius: 8px; background: #232b36; color: #e3e8ee; font-size: 15px; line-height: 1.35; }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas element.</canvas>
		<button id="fullscreen" type="button" hidden>Full screen</button>
		<div id="installHint" role="status" hidden>To play full screen, tap Share, then Add to Home Screen.</div>
		<div id="rotate" role="status"><b aria-hidden="true">&#10227;</b><span>Turn your phone sideways to play</span></div>
		<div id="status">
			<div id="message">Loading Scrapline&hellip;</div>
			<div id="bar"><div></div></div>
		</div>
		<noscript>Scrapline needs JavaScript.</noscript>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
const status = document.getElementById('status');
const message = document.getElementById('message');
const bar = document.querySelector('#bar > div');

function fail(text) {
	message.textContent = text;
	document.getElementById('bar').hidden = true;
}

// Full screen. Safari on iPhone has no Fullscreen API for pages, so there the
// only way is Add to Home Screen (the manifest and meta tags above).
const fullscreenButton = document.getElementById('fullscreen');
const installHint = document.getElementById('installHint');
const root = document.documentElement;
const installed = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone === true;
const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
const isFullscreen = function () { return Boolean(document.fullscreenElement || document.webkitFullscreenElement); };
function updateFullscreenButton() {
	fullscreenButton.textContent = isFullscreen() ? 'Exit full screen' : 'Full screen';
}
if (!installed) {
	fullscreenButton.hidden = false;
	fullscreenButton.addEventListener('click', function () {
		if (!requestFullscreen) {
			installHint.hidden = !installHint.hidden;
		} else if (isFullscreen()) {
			exitFullscreen.call(document);
		} else {
			Promise.resolve(requestFullscreen.call(root)).catch(function () {
				installHint.hidden = false;
			});
		}
	});
	document.addEventListener('fullscreenchange', updateFullscreenButton);
	document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
}

const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
if (missing.length > 0) {
	fail('This browser cannot run the game: ' + missing.join(', '));
} else {
	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) {
				bar.style.width = Math.round((current / total) * 100) + '%';
			} else {
				message.textContent = 'Loading Scrapline… ' + Math.round(current / 1048576) + ' MB';
			}
		},
	}).then(function () {
		status.hidden = true;
	}, function (err) {
		fail('The game failed to start: ' + err.message);
	});
}
		</script>
	</body>
</html>
