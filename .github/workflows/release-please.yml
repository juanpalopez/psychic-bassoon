name: Release PR

# Keeps a "chore: release X" pull request up to date from the Conventional
# Commits on main. Merging it tags main, and the tag starts release.yml.
# A bot token is needed because a tag made with GITHUB_TOKEN starts no
# workflow, and because only admins and the app may create `v*` tags.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # skip-github-release is set in the config: this step only opens or
      # updates the release PR; release.yml creates the GitHub Release.
      - name: Open or update the release PR
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Tag main when the release PR was merged
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          # the squash commit of the release PR: "chore: release 0.1.0-alpha.2 (#N)"
          first_line="${SUBJECT%%$'\n'*}"
          if [[ ! "$first_line" =~ ^chore:\ release\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?) ]]; then
            echo "Not a release commit; nothing to tag."
            exit 0
          fi
          tag="v${BASH_REMATCH[1]}"
          echo "Tagging ${SHA} as ${tag}"
          gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${SHA}"
