name: Release PR

# Keeps a "chore: release X" pull request up to date from the Conventional
# Commits on main. Merging it tags main, and the tag starts release.yml.
# A bot token is needed because a tag made with GITHUB_TOKEN starts no
# workflow, and because only admins and the app may create `v*` tags.
# The tag job is separate and keyed by commit, so a newer push cannot cancel it.

on:
  push:
    branches: [main]
  # Re-run the tag step for a release PR whose push run did not tag (run it from main).
  workflow_dispatch:
    inputs:
      sha:
        description: The merge commit of the release PR on main (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-pr:
    name: release-pr
    # stays green and idle until the owner has created the GitHub App and set the variable
    if: ${{ github.event_name == 'push' && vars.RELEASE_APP_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - name: Create the app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # skip-github-release is set in the config: this step only opens or
      # updates the release PR; release.yml creates the GitHub Release.
      - name: Open or update the release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tag:
    name: tag
    if: ${{ vars.RELEASE_APP_ID != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-tag-${{ inputs.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Create the app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Tag main when the release PR was merged
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'${SHA}' is not a full commit SHA."
            exit 1
          fi
          # a dispatch can name any commit: it must already be on main
          status="$(gh api "repos/${REPO}/compare/main...${SHA}" --jq .status)"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::${SHA} is not on main (${status})."
            exit 1
          fi
          # Only the merge of release-please's own PR counts, never a commit that merely
          # has a matching title: the PR must come from its branch (release-please--branches--main--components--<package>) and carry its label.
          pr="$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '
            [.[] | select((.head.ref | startswith("release-please--branches--main--"))
              and .head.repo.full_name == env.REPO
              and (.labels | map(.name) | index("autorelease: pending")))][0].number // empty')"
          if [ -z "$pr" ]; then
            echo "Not the merge of a pending release PR; nothing to tag."
            exit 0
          fi
          # the version release-please wrote at this commit, not text from a title
          version="$(gh api "repos/${REPO}/contents/.release-please-manifest.json?ref=${SHA}" \
            --jq .content | base64 -d | jq -er '."."')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The manifest version '${version}' is not SemVer."
            exit 1
          fi
          tag="v${version}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists."
          else
            echo "Tagging ${SHA} as ${tag}"
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${SHA}"
          fi
          # release-please stops opening release PRs while a merged one is still "pending"
          gh label create "autorelease: tagged" --repo "$REPO" --color ededed 2>/dev/null || true
          gh pr edit "$pr" --repo "$REPO" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
