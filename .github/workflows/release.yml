name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Require a semantic version tag
        run: bash scripts/check-release-tag.sh "$TAG"

      - name: Require the tag to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Tag a commit that has been merged."
            exit 1
          fi

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      all-desktop: true

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      # The desktop builds are exported once, by the ci job above.
      - name: Fetch the desktop builds from the ci job
        uses: actions/download-artifact@v8
        with:
          name: godot-desktop
          path: dist

      - name: Package the builds
        run: |
          name="papercraft-kingdom-defense"
          bash scripts/check-desktop-export.sh "dist/linux/${name}.x86_64"
          bash scripts/check-desktop-export.sh "dist/windows/${name}.exe"
          test -s "dist/macos/${name}.zip"
          # artifacts do not keep file modes, so make the Linux binary executable again
          chmod +x "dist/linux/${name}.x86_64"
          (cd dist/linux && zip -r "../../${name}-${TAG}-linux-x86_64.zip" .)
          (cd dist/windows && zip -r "../../${name}-${TAG}-windows-x86_64.zip" .)
          # Godot already zips the macOS .app (ad-hoc signed, not notarized)
          cp "dist/macos/${name}.zip" "${name}-${TAG}-macos-universal.zip"

      - name: Create GitHub Release
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" papercraft-kingdom-defense-"${TAG}"-*.zip --title "$TAG" "${flags[@]}"
