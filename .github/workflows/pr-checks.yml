name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR title and commit messages
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          scopes='sim|render|ui|content|assets|docs|ci|build|deps'
          # Lowercase summary, except Dependabot's fixed "Bump ..." wording.
          pattern="^(${types})(\((${scopes})\))?!?: (Bump [^ ].{0,66}[^.]|[^A-Z ].{0,70}[^.])$"
          status=0

          check() {
            if ! printf '%s' "$1" | grep -Eq "$pattern"; then
              echo "::error::Not a valid Conventional Commit: $1"
              status=1
            fi
          }

          check "$PR_TITLE"
          while IFS= read -r subject; do
            check "$subject"
          done < <(git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}")

          if [ "$status" -ne 0 ]; then
            echo "Expected: type(scope): summary"
            echo "Types: ${types}"
            echo "Scopes (optional): ${scopes}"
            echo "Summary: imperative, lowercase start, no trailing period, max 72 chars."
          fi
          exit "$status"

  ticket-reference:
    name: Ticket reference
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Warn if no ticket is referenced
        run: |
          if ! printf '%s' "$PR_BODY" | grep -Eiq '(closes|fixes|refs|resolves) #[0-9]+'; then
            echo "::warning::No ticket referenced. Add 'Closes #N' (or 'Refs #N') to the PR description."
          fi

  pr-size:
    name: PR size
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # the owner allows a larger PR by adding this label (owner, 2026-10-18, #349)
      ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'size-exception') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Count the production lines this PR changes (limit 300)
        run: |
          flags=()
          if [ "$ALLOW" = "true" ]; then flags+=(--allow); fi
          # run the base branch's counter, so a PR cannot change its own limit or rules
          # (the PR's copy only when the base has none yet: the PR that adds it)
          counter="$RUNNER_TEMP/check-pr-size.mjs"
          if ! git show "${BASE_SHA}:scripts/check-pr-size.mjs" > "$counter" 2>/dev/null; then
            cp scripts/check-pr-size.mjs "$counter"
          fi
          node "$counter" "$BASE_SHA" "$HEAD_SHA" "${flags[@]}"
