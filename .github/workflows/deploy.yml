name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read # to download the Godot export built by the CI run
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-tip:
    name: check-tip
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only deploy the current tip of main
        id: tip
        run: |
          tip=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: ${HEAD_SHA} is not the tip of main (${tip}). A re-run of an old CI run must not roll the site back."
          fi

  deploy:
    name: deploy
    needs: check-tip
    if: needs.check-tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The Godot export is built and tested once, by the CI run being deployed.
      - name: Fetch the Godot export from the CI run
        uses: actions/download-artifact@v8
        with:
          name: godot-web
          path: dist/godot
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the Godot export is complete
        run: |
          test -s dist/godot/index.html
          test -s dist/godot/index.wasm
          test -s dist/godot/index.pck
          # the TypeScript game must still own the root
          grep -q "assets/" dist/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check the live page serves this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          want=$(grep -o "src=\"${BASE_PATH}assets/[^\"]*\"" dist/index.html | head -n 1)
          if [ -z "$want" ]; then
            echo "::error::No hashed entry script found in dist/index.html."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS --max-time 20 -o page.html -w '%{http_code}' "${PAGE_URL}?ci=${HEAD_SHA}" || true)
            if [ "$status" = "200" ] && grep -qF "$want" page.html; then
              echo "Live page serves this build: ${want}"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status}, expected ${want} not served yet"
            sleep 10
          done
          echo "::error::The live page at ${PAGE_URL} did not serve this build (${want}). The site may already be published; re-run the deploy or check Pages."
          exit 1

      - name: Check the Godot export is served under /godot/
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 20 -o godot.html -w '%{http_code}' "${PAGE_URL}godot/index.html" || true)
            wasm=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -I "${PAGE_URL}godot/index.wasm" || true)
            if [ "$code" = "200" ] && [ "$wasm" = "200" ] && grep -q 'GODOT_CONFIG' godot.html; then
              echo "Godot export is live under /godot/"
              exit 0
            fi
            echo "Attempt ${attempt}: index ${code}, wasm ${wasm}"
            sleep 10
          done
          echo "::error::The Godot export is not served under ${PAGE_URL}godot/."
          exit 1
