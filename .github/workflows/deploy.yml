name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-tip:
    name: check-tip
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only deploy the current tip of main
        id: tip
        run: |
          tip=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: ${HEAD_SHA} is not the tip of main (${tip}). A re-run of an old CI run must not roll the site back."
          fi

  deploy:
    name: deploy
    needs: check-tip
    if: needs.check-tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the Godot export built by the CI run
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false

      # The Godot export is built and tested once, by the CI run being deployed.
      - name: Fetch the Godot export from the CI run
        uses: actions/download-artifact@v8
        with:
          name: godot-web
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the Godot export is complete
        run: |
          test -s dist/index.html
          test -s dist/index.wasm
          test -s dist/index.pck
          test -s dist/manifest.webmanifest
          # the CI run keeps its export for 7 days; a re-run after that fails here
          sha256sum dist/index.pck dist/index.wasm

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check the live page serves this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          want_pck=$(sha256sum < dist/index.pck)
          want_wasm=$(sha256sum < dist/index.wasm)
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 20 -o live.html -w '%{http_code}' "${PAGE_URL}index.html?ci=${HEAD_SHA}" || true)
            curl -sS --max-time 60 -o live.pck "${PAGE_URL}index.pck?ci=${HEAD_SHA}" || true
            curl -sS --max-time 120 -o live.wasm "${PAGE_URL}index.wasm?ci=${HEAD_SHA}" || true
            got_pck=$(sha256sum < live.pck)
            got_wasm=$(sha256sum < live.wasm)
            if [ "$code" = "200" ] && [ "$got_pck" = "$want_pck" ] && [ "$got_wasm" = "$want_wasm" ] && grep -q 'GODOT_CONFIG' live.html; then
              echo "The Godot export is live at the site root"
              exit 0
            fi
            echo "Attempt ${attempt}: index ${code}, pck/wasm digests differ or are missing"
            sleep 10
          done
          echo "::error::The Godot export is not served at ${PAGE_URL}."
          exit 1
