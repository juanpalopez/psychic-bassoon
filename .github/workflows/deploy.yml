name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-tip:
    name: check-tip
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only deploy the current tip of main
        id: tip
        run: |
          tip=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: ${HEAD_SHA} is not the tip of main (${tip}). A re-run of an old CI run must not roll the site back."
          fi

  deploy:
    name: deploy
    needs: check-tip
    if: needs.check-tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
