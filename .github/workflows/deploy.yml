name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-tip:
    name: check-tip
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only deploy the current tip of main
        id: tip
        run: |
          tip=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: ${HEAD_SHA} is not the tip of main (${tip}). A re-run of an old CI run must not roll the site back."
          fi

  deploy:
    name: deploy
    needs: check-tip
    if: needs.check-tip.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: false
          persist-credentials: false

      # The web build is retired (#318): Pages serves one static page that links to the releases.
      - name: Check the page links to the releases
        run: grep -qF "$RELEASES_URL" site/index.html
        env:
          RELEASES_URL: https://github.com/juanpalopez/psychic-bassoon/releases/latest

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check the live page links to the releases
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASES_URL: https://github.com/juanpalopez/psychic-bassoon/releases/latest
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 20 -o live.html -w '%{http_code}' "${PAGE_URL}?ci=${HEAD_SHA}" || true)
            if [ "$code" = "200" ] && grep -qF "$RELEASES_URL" live.html; then
              echo "The releases page is live at the site root"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}, or the page has no releases link yet"
            sleep 10
          done
          echo "::error::The releases page is not served at ${PAGE_URL}."
          exit 1
