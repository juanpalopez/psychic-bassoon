name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Published in actionlint_1.7.12_checksums.txt on the release page.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck >/dev/null || { echo "::error::shellcheck is missing from the runner, so actionlint would skip shell checks."; exit 1; }
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
          # The fixture must be rejected with exit code 1 (findings), not 3 (cannot read).
          status=0
          ./actionlint scripts/fixtures/bad-workflow.yml >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::actionlint exited with ${status} on scripts/fixtures/bad-workflow.yml; the self-test expects 1."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm check:size

      - name: Asset budget and credits
        run: pnpm check:assets

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  godot:
    name: godot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Read the pinned Godot version
        id: version
        run: |
          version="$(tr -d '[:space:]' < .godot-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "templates=${version/-/.}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot and the web export templates
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.version.outputs.version }}

      - name: Download Godot and the web templates (verified)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TEMPLATES: ${{ steps.version.outputs.templates }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${VERSION}"
          binary="Godot_v${VERSION}_linux.x86_64.zip"
          tpz="Godot_v${VERSION}_export_templates.tpz"
          curl -sSfL --retry 3 -O "${base}/SHA512-SUMS.txt" -O "${base}/${binary}" -O "${base}/${tpz}"
          grep -E " (${binary}|${tpz})$" SHA512-SUMS.txt | sha512sum -c -
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/"${TEMPLATES}"
          unzip -q "${binary}" -d ~/godot-bin
          unzip -q -j "${tpz}" templates/version.txt templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
            -d ~/.local/share/godot/export_templates/"${TEMPLATES}"
          rm -f "${binary}" "${tpz}"

      - name: Install gdtoolkit
        run: pip install --user gdtoolkit==4.5.0

      - name: Format and lint (gdformat, gdlint)
        working-directory: godot
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gdformat --check main.gd tests sim content render ui
          gdlint main.gd tests sim content render ui

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sim purity
        run: pnpm check:sim-purity

      - name: Import the project
        run: ~/godot-bin/Godot_v*_linux.x86_64 --headless --path godot --import

      - name: GUT tests
        run: ~/godot-bin/Godot_v*_linux.x86_64 --headless --path godot -s addons/gut/gut_cmdln.gd -gexit

      - name: Web export
        run: |
          mkdir -p build/web
          ~/godot-bin/Godot_v*_linux.x86_64 --headless --path godot --export-release "Web" ../build/web/index.html

      - name: Download budget
        run: pnpm check:godot-size

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test of the export
        run: pnpm test:e2e:godot

      - name: Upload the web export
        uses: actions/upload-artifact@v7
        with:
          name: godot-web
          path: build/web
          retention-days: 7
