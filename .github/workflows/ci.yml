name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      all-desktop:
        description: Also export the Windows and macOS builds (the release workflow sets it)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 0

      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Published in actionlint_1.7.12_checksums.txt on the release page.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck >/dev/null || { echo "::error::shellcheck is missing from the runner, so actionlint would skip shell checks."; exit 1; }
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
          # The fixture must be rejected with exit code 1 (findings), not 3 (cannot read).
          status=0
          ./actionlint scripts/fixtures/bad-workflow.yml >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::actionlint exited with ${status} on scripts/fixtures/bad-workflow.yml; the self-test expects 1."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Asset budget and credits
        run: pnpm check:assets

      - name: Frozen fixtures
        run: pnpm check:fixtures

      - name: Frozen fixtures unchanged in this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          frozen="fixtures/prng.json fixtures/maps.json fixtures/routes.json"
          # shellcheck disable=SC2086
          if ! git diff --quiet "$BASE_SHA" HEAD -- $frozen; then
            echo "::error::A frozen fixture changed in this PR; they are never regenerated."
            # shellcheck disable=SC2086
            git diff --stat "$BASE_SHA" HEAD -- $frozen
            exit 1
          fi

  godot:
    name: godot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - name: Read the pinned Godot version
        id: version
        run: |
          version="$(tr -d '[:space:]' < .godot-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "templates=${version/-/.}" >> "$GITHUB_OUTPUT"

      - name: Restore Godot and the desktop export templates
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          # one key for every run: a tag run can only restore caches saved on main, so the
          # release templates are cached by the main runs too instead of downloaded per release
          key: godot-${{ steps.version.outputs.version }}-desktop-v3

      - name: Download Godot and the desktop templates (verified)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TEMPLATES: ${{ steps.version.outputs.templates }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${VERSION}"
          binary="Godot_v${VERSION}_linux.x86_64.zip"
          tpz="Godot_v${VERSION}_export_templates.tpz"
          curl -sSfL --retry 3 -O "${base}/SHA512-SUMS.txt" -O "${base}/${binary}" -O "${base}/${tpz}"
          grep -E " (${binary}|${tpz})$" SHA512-SUMS.txt > wanted.txt
          test "$(wc -l < wanted.txt)" -eq 2
          sha512sum -c wanted.txt
          # export-release needs only the release templates (all three desktops, so the
          # one cache serves both CI and releases)
          wanted=(templates/version.txt templates/linux_release.x86_64)
          wanted+=(templates/windows_release_x86_64.exe templates/macos.zip)
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/"${TEMPLATES}"
          unzip -q "${binary}" -d ~/godot-bin
          unzip -q -j "${tpz}" "${wanted[@]}" -d ~/.local/share/godot/export_templates/"${TEMPLATES}"
          rm -f "${binary}" "${tpz}" wanted.txt SHA512-SUMS.txt

      - name: Install gdtoolkit
        run: pip install --user gdtoolkit==4.5.0

      - name: Format and lint (gdformat, gdlint)
        working-directory: godot
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          files=$(find . -name '*.gd' -not -path './addons/*' -not -path './.godot/*')
          # shellcheck disable=SC2086
          gdformat --check $files
          # shellcheck disable=SC2086
          gdlint $files

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sim purity
        run: pnpm check:sim-purity

      - name: Render boundary
        run: pnpm check:render-boundary

      - name: Locate Godot
        run: |
          binary=("$HOME"/godot-bin/Godot_v*_linux.x86_64)
          chmod +x "${binary[0]}"
          echo "GODOT=${binary[0]}" >> "$GITHUB_ENV"

      - name: Import the project
        # --import exits 0 even when a script fails to parse: the checker also fails on any
        # ERROR, SCRIPT ERROR or SHADER ERROR line, a non-zero exit or a timeout
        run: bash scripts/run-godot-checked.sh 600 import.log -- "$GODOT" --headless --path godot --import

      - name: GUT tests
        run: |
          "$GODOT" --headless --path godot -s addons/gut/gut_cmdln.gd -gexit

      - name: Headless game time budget
        env:
          # one whole bot game (about 30 minutes of play, 20 waves, on the 32x20 valley) took
          # 13 s on the runner (PR #342; 14.5 s of CPU, 41 to 46 s wall in a busy 2-core
          # container), so the budget is about 4.5 times the runner's time: it catches a sim
          # that got several times slower, not noise (docs/BALANCE.md). Seed 2 is a guard mix
          # win on the valley (seed 4, the win on 16x11, falls at wave 16)
          BUDGET_SECONDS: "60"
        run: |
          start=$SECONDS
          "$GODOT" --headless --path godot -s tools/balance_run.gd -- \
            --seeds=2 --profiles=guardMix --waves=20 | tee game.log
          elapsed=$((SECONDS - start))
          echo "A whole bot game took ${elapsed} s (budget ${BUDGET_SECONDS} s)"
          if ! grep -q "median waves cleared: 20" game.log; then
            echo "::error::The bot game did not reach wave 20"
            exit 1
          fi
          if [ "$elapsed" -gt "$BUDGET_SECONDS" ]; then
            echo "::error::The bot game took ${elapsed} s, over the ${BUDGET_SECONDS} s budget"
            exit 1
          fi

      - name: Linux export
        run: |
          mkdir -p build/linux
          "$GODOT" --headless --path godot --export-release "Linux" ../build/linux/papercraft-kingdom-defense.x86_64
          bash scripts/check-desktop-export.sh build/linux/papercraft-kingdom-defense.x86_64

      - name: Run the Linux build headless
        # the exported game (no tests or tools in it) must start and run its scene for 300
        # frames with no engine error, script error or shader error, exit 0 and not hang;
        # headless uses the dummy renderer, so nothing is drawn, but scripts, resources and
        # shader compiles are checked as far as they log
        run: >-
          bash scripts/run-godot-checked.sh 120 run.log --
          build/linux/papercraft-kingdom-defense.x86_64 --headless --quit-after 300

      - name: Windows and macOS exports
        if: inputs.all-desktop
        run: |
          mkdir -p build/windows build/macos
          "$GODOT" --headless --path godot --export-release "Windows" ../build/windows/papercraft-kingdom-defense.exe
          bash scripts/check-desktop-export.sh build/windows/papercraft-kingdom-defense.exe
          "$GODOT" --headless --path godot --export-release "macOS" ../build/macos/papercraft-kingdom-defense.zip
          listing="$(unzip -l build/macos/papercraft-kingdom-defense.zip)"
          if ! grep -qE '\.app/Contents/Resources/[^/]+\.pck$' <<< "$listing"; then
            echo "::error::The macOS export has no .app with a .pck"
            exit 1
          fi

      - name: Upload the desktop export
        # only the release workflow uses it
        if: inputs.all-desktop
        uses: actions/upload-artifact@v7
        with:
          name: godot-desktop
          path: build
          if-no-files-found: error
          retention-days: 7
