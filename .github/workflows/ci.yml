name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      all-desktop:
        description: Also export the Windows and macOS builds (the release workflow sets it)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only what the change can reach (#359); pushes to main and tags run all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      godot: ${{ steps.select.outputs.godot }}
      gut: ${{ steps.select.outputs.gut }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Select the Godot job and the GUT tests
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            printf 'godot=true\ngut=all\n' | tee -a "$GITHUB_OUTPUT"
          else
            # the base branch's copy of the script decides, so a PR cannot change its own rules
            # (this file still comes from the PR; the full run on main is the backstop)
            git show "${BASE_SHA}:scripts/select-tests.mjs" > "$RUNNER_TEMP/select-tests.mjs" 2>/dev/null \
              || cp scripts/select-tests.mjs "$RUNNER_TEMP/select-tests.mjs"
            node "$RUNNER_TEMP/select-tests.mjs" "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          fi

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 0

      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Published in actionlint_1.7.12_checksums.txt on the release page.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck >/dev/null || { echo "::error::shellcheck is missing from the runner, so actionlint would skip shell checks."; exit 1; }
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
          # The fixture must be rejected with exit code 1 (findings), not 3 (cannot read).
          status=0
          ./actionlint scripts/fixtures/bad-workflow.yml >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::actionlint exited with ${status} on scripts/fixtures/bad-workflow.yml; the self-test expects 1."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Asset budget and credits
        run: pnpm check:assets

      - name: Frozen fixtures
        run: pnpm check:fixtures

      - name: Frozen fixtures unchanged in this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          frozen="fixtures/prng.json fixtures/maps.json fixtures/routes.json"
          # shellcheck disable=SC2086
          if ! git diff --quiet "$BASE_SHA" HEAD -- $frozen; then
            echo "::error::A frozen fixture changed in this PR; they are never regenerated."
            # shellcheck disable=SC2086
            git diff --stat "$BASE_SHA" HEAD -- $frozen
            exit 1
          fi

  # The GUT suite, in 4 shards (scripts/run-gut-parallel.sh --shard i/4 splits the script list
  # by the seconds in scripts/gut-times.json), each shard its own runner with the cores
  # to itself. A pull request's subset is split the same way; a shard with nothing to run
  # passes at once.
  gut:
    name: gut (shard ${{ matrix.shard }})
    needs: changes
    # run unless the selector said no: if it failed or printed nothing, run everything
    if: ${{ !cancelled() && needs.changes.outputs.godot != 'false' && needs.changes.outputs.gut != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - uses: ./.github/actions/setup-godot

      - name: GUT tests
        env:
          GUT_TESTS: ${{ needs.changes.outputs.gut }}
          SHARD: ${{ matrix.shard }}
        run: |
          # one Godot process per test script (short ones batched), one worker per core (up
          # to 8): the suite is single-threaded, and the valley tests alone took the serial run
          # past the job's 30 minutes (#420)
          if [ -z "$GUT_TESTS" ] || [ "$GUT_TESTS" = "all" ]; then
            bash scripts/run-gut-parallel.sh --shard "${SHARD}/4"
          else
            # only the tests that reach a changed file (scripts/select-tests.mjs)
            echo "GUT subset: ${GUT_TESTS}"
            bash scripts/run-gut-parallel.sh --shard "${SHARD}/4" -t "$GUT_TESTS"
          fi

  # Everything else in the Godot checks runs once, beside the shards.
  godot-checks:
    name: godot-checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.godot != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false

      - uses: ./.github/actions/setup-godot

      - name: Install gdtoolkit
        run: pip install --user gdtoolkit==4.5.0

      - name: Format and lint (gdformat, gdlint)
        working-directory: godot
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          files=$(find . -name '*.gd' -not -path './addons/*' -not -path './.godot/*')
          # shellcheck disable=SC2086
          gdformat --check $files
          # shellcheck disable=SC2086
          gdlint $files

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sim purity
        run: pnpm check:sim-purity

      - name: Render boundary
        run: pnpm check:render-boundary

      - name: Headless game time budget
        env:
          # one whole bot game (about 30 minutes of play, 20 waves, on the 32x20 valley) took
          # 13 s on the runner (PR #342; 14.5 s of CPU, 41 to 46 s wall in a busy 2-core
          # container), so the budget is about 4.5 times the runner's time: it catches a sim
          # that got several times slower, not noise (docs/BALANCE.md). Since #458 the game
          # board is the 40 by 24 layout valley at half pace, where a game of the mix does not
          # clear wave 20 inside the bot's thirty minutes on seeds 1 to 12. So this plays the
          # guard mix on seed 7 (it builds Guard Tents and a Mess Tent, so the barracks, beam and
          # spec ticks are timed too) and requires that the game ENDED, the Heartstone lost, before
          # the thirty minute cap: its row says fewer than 30.0 minutes (24.8 measured, 10 s wall)
          BUDGET_SECONDS: "60"
        run: |
          start=$SECONDS
          "$GODOT" --headless --path godot -s tools/balance_run.gd -- \
            --seeds=7 --profiles=guardMix --waves=20 | tee game.log
          elapsed=$((SECONDS - start))
          echo "A whole bot game took ${elapsed} s (budget ${BUDGET_SECONDS} s)"
          if ! awk '$1 == "guardMix" && $2 == 7 && $4 > 0 && $NF < 30.0 { found = 1 } END { exit !found }' game.log; then
            echo "::error::The bot game did not end (the Heartstone did not fall) inside the bot's thirty minutes"
            exit 1
          fi
          if [ "$elapsed" -gt "$BUDGET_SECONDS" ]; then
            echo "::error::The bot game took ${elapsed} s, over the ${BUDGET_SECONDS} s budget"
            exit 1
          fi

      - name: Linux export
        run: |
          mkdir -p build/linux
          "$GODOT" --headless --path godot --export-release "Linux" ../build/linux/papercraft-kingdom-defense.x86_64
          bash scripts/check-desktop-export.sh build/linux/papercraft-kingdom-defense.x86_64

      - name: Run the Linux build headless
        # the exported game (no tests or tools in it) must start and run its scene for 300
        # frames with no engine error, script error or shader error, exit 0 and not hang;
        # headless uses the dummy renderer, so nothing is drawn, but scripts, resources and
        # shader compiles are checked as far as they log
        run: >-
          bash scripts/run-godot-checked.sh 120 run.log --
          build/linux/papercraft-kingdom-defense.x86_64 --headless --quit-after 300

      - name: Windows and macOS exports
        if: inputs.all-desktop
        run: |
          mkdir -p build/windows build/macos
          "$GODOT" --headless --path godot --export-release "Windows" ../build/windows/papercraft-kingdom-defense.exe
          bash scripts/check-desktop-export.sh build/windows/papercraft-kingdom-defense.exe
          "$GODOT" --headless --path godot --export-release "macOS" ../build/macos/papercraft-kingdom-defense.zip
          listing="$(unzip -l build/macos/papercraft-kingdom-defense.zip)"
          if ! grep -qE '\.app/Contents/Resources/[^/]+\.pck$' <<< "$listing"; then
            echo "::error::The macOS export has no .app with a .pck"
            exit 1
          fi

      - name: Upload the desktop export
        # only the release workflow uses it
        if: inputs.all-desktop
        uses: actions/upload-artifact@v7
        with:
          name: godot-desktop
          path: build
          if-no-files-found: error
          retention-days: 7

  # The required check "godot" (the repo ruleset names ci, Conventional Commits and godot):
  # it passes when the shards and the single-run checks passed or were skipped, which is
  # what a pull request that cannot reach Godot gets.
  godot:
    name: godot
    needs: [gut, godot-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a Godot job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gut and godot-checks: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A Godot job ended as ${r}"; exit 1 ;;
            esac
          done
