version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # Majors arrive as separate PRs so one breaking release cannot block the rest.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Three.js is pinned and upgraded by hand with a performance check.
      # Ignoring it also skips its security updates, so check Three.js advisories by hand.
      - dependency-name: three
      - dependency-name: "@types/three"
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep the Node typings on the Node version CI and .nvmrc use (22). A
      # 22 to 26 bump made the npm updater fail in `pnpm update` (run 37212587370).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
