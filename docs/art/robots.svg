<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" role="img" aria-label="Robot silhouettes">
  <title>Robot silhouettes: Skitter, Hauler, Smelter, Overseer (rough, shape and colour only)</title>
  <rect width="480" height="140" fill="#11151b"/>
  <g fill="#8794a3">
    <!-- Skitter: small spindly courier on three wheels -->
    <rect x="46" y="48" width="28" height="22" rx="4"/>
    <rect x="58" y="36" width="4" height="14"/>
    <circle cx="44" cy="84" r="9"/><circle cx="76" cy="84" r="9"/><circle cx="60" cy="90" r="7"/>
    <!-- Hauler: bipedal loader with a cargo frame -->
    <rect x="156" y="52" width="36" height="36" rx="4" fill="#a8b4c2"/>
    <rect x="150" y="38" width="48" height="12" rx="3"/>
    <rect x="160" y="88" width="9" height="26"/><rect x="180" y="88" width="9" height="26"/>
    <!-- Smelter: wide tracked crawler with glowing vents -->
    <rect x="250" y="56" width="76" height="40" rx="6"/>
    <rect x="244" y="96" width="88" height="16" rx="8" fill="#5a6678"/>
    <rect x="262" y="44" width="12" height="14" fill="#ff8a3d"/><rect x="284" y="44" width="12" height="14" fill="#ff8a3d"/>
    <!-- Overseer: tall boss with a command crown -->
    <rect x="392" y="46" width="62" height="58" rx="6" fill="#ff4d5e"/>
    <polygon points="392,46 404,20 416,40 423,16 430,40 442,20 454,46"/>
    <rect x="398" y="104" width="14" height="24"/><rect x="434" y="104" width="14" height="24"/>
  </g>
  <g fill="#e3e8ee" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="60" y="130">Skitter</text><text x="174" y="130">Hauler</text>
    <text x="288" y="130">Smelter</text><text x="423" y="136">Overseer</text>
  </g>
</svg>
