<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" role="img" aria-label="Tower silhouettes">
  <title>Tower silhouettes: Welder, Rivet Mortar, Quench Coil, Mainline Arc (rough, shape and colour only)</title>
  <rect width="480" height="140" fill="#11151b"/>
  <g>
    <!-- Welder: round base with a single barrel -->
    <circle cx="60" cy="82" r="22" fill="#3ddbd9"/><rect x="58" y="34" width="8" height="46" fill="#3ddbd9"/>
    <!-- Rivet Mortar: squat base with a fat angled tube -->
    <rect x="156" y="70" width="48" height="26" rx="4" fill="#ff8a3d"/>
    <rect x="170" y="38" width="22" height="40" rx="6" fill="#ff8a3d" transform="rotate(-18 181 78)"/>
    <!-- Quench Coil: stacked rings -->
    <ellipse cx="300" cy="94" rx="30" ry="9" fill="#9b8cff"/>
    <ellipse cx="300" cy="76" rx="24" ry="8" fill="#9b8cff"/>
    <ellipse cx="300" cy="60" rx="18" ry="7" fill="#9b8cff"/>
    <!-- Mainline Arc: pylon with a prong crown -->
    <rect x="410" y="48" width="14" height="52" fill="#e8f06a"/>
    <polygon points="396,48 404,22 412,44 417,18 422,44 430,22 438,48" fill="#e8f06a"/>
    <rect x="396" y="98" width="42" height="12" rx="3" fill="#e8f06a"/>
  </g>
  <g fill="#e3e8ee" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="60" y="130">Welder</text><text x="180" y="130">Rivet Mortar</text>
    <text x="300" y="130">Quench Coil</text><text x="417" y="130">Mainline Arc</text>
  </g>
  <g fill="none" stroke="#8794a3" font-size="9">
    <text x="240" y="14" fill="#8794a3" text-anchor="middle" font-family="monospace" stroke="none">level 1 to 3 add barrels, rings or prongs; level shown by pips</text>
  </g>
</svg>
