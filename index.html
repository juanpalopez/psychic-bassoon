<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11151b" />
    <!-- Installed from the Home Screen the game runs full screen, no browser bars -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Scrapline" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Scrapline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #11151b;
      }
      /* iOS Safari: 100% is taller than what is visible once its toolbars show */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate" role="status">
      <b aria-hidden="true">⟳</b>
      <span>Turn your phone sideways to play</span>
    </div>
    <div id="app">
      <header id="hud-top" class="hud"></header>
      <main id="stage"></main>
      <section id="panel"></section>
      <nav id="controls" class="controls"></nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
